<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felps Vendas - Workshop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }
    header {
      background-color: #b30000;
      padding: 30px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
    }
    section {
      padding: 40px;
      text-align: center;
    }
    .cta {
      background-color: #b30000;
      color: white;
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    .price {
      font-size: 2em;
      color: #ff4d4d;
    }
    footer {
      background-color: #111;
      color: #aaa;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Felps Vendas</h1>
    <p>Transforme suas habilidades em lucro. Workshop para jovens!</p>
  </header>

  <section>
    <h2>Duração: 24 Horas</h2>
    <p>Aprenda as melhores técnicas de vendas com Felpszada. Um workshop direto, prático e poderoso.</p>
    <p class="price">Apenas R$ 50</p>
    <button class="cta" onclick="alert('Pagamento via Pix ou Cartão. Entre em contato para finalizar.')">Quero Participar</button>
  </section>

  <footer>
    &copy; 2025 Felpszada. Todos os direitos reservados.
  </footer>
</body>
</html>
