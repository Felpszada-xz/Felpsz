<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felps Vendas - Workshop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: url('https://images.unsplash.com/photo-1605902711622-cfb43c44367f?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
    }

    /* Escurece o fundo para legibilidade */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    header {
      background-color: rgba(179, 0, 0, 0.8);
      padding: 30px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5em;
    }

    section {
      padding: 40px;
      text-align: center;
    }

    .cta {
      background-color: #b30000;
      color: white;
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    .price {
      font-size: 2em;
      color: #ff4d4d;
    }

    footer {
      background-color: rgba(17, 17, 17, 0.8);
      color: #aaa;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Felps Vendas</h1>
    <p>Transforme suas habilidades em lucro. Workshop para jovens!</p>
  </header>

  <section>
    <h2>Duração: 24 Horas</h2>
    <p>Aprenda as melhores técnicas de vendas com Felpszada. Um workshop direto, prático e poderoso.</p>
    <p class="price">Apenas R$ 50</p>
    <button class="cta" onclick="alert('Pagamento via Pix ou Cartão. Entre em contato para finalizar.')">Quero Participar</button>
  </section>

  <footer>
    &copy; 2025 Felpszada. Todos os direitos reservados.
  </footer>
</body>
</html>
